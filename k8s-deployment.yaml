apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  labels:
    app: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: my-registry/my-app:v1 # Replace with your actual image repository and tag
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        # If your app requires env variables (like DATABASE_URL or JWT_SECRET), add them here:
        # - name: JWT_SECRET
        #   valueFrom:
        #     secretKeyRef:
        #       name: my-app-secrets
        #       key: jwt-secret
---
apiVersion: v1
kind: Service
metadata:
  name: my-app-service
spec:
  type: NodePort # Use NodePort for direct kubeadm access, or LoadBalancer if you have one configured
  selector:
    app: my-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080 # This exposes the service on port 30080 across all your cluster nodes
